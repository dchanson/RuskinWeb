server {
    listen 8080;
    server_name ruskin.english.selu.edu;
    
    client_max_body_size 10M;

    # Update root directory
    root /Users/userselu/RuskinWeb;  # Path to your project directory

    index index.php index.html index.htm;
    autoindex on;
    
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    add_header 'Cache-Control' 'max-age=21600';
    
    # Handle files under /web/ including .xml files
    location /web/ {
        try_files $uri $uri/ =404;

        location /web/xml {
            location ~ \.xml$ {
                add_header 'Cache-Control' 'max-age=21600';
                add_header Content-disposition "attachment; filename=$uri";
            }
        }
        
        location ~ /(.*\.php)$ {
            try_files $uri $uri/ =404;
            fastcgi_pass 127.0.0.1:9000;  # PHP-FPM server
            include fastcgi_params;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
        }
    }

    # Handle PHP files outside /web/ (e.g., /witnesses/)
    location ~ \.php$ {
        try_files $uri =404;  # Ensure the PHP file exists
        fastcgi_pass 127.0.0.1:9000;  # PHP-FPM server
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Proxy for other paths (optional)
    location / {
        proxy_pass http://localhost:9001;  # You may want to adjust or remove this
        add_header X-Proxy "On" always;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
